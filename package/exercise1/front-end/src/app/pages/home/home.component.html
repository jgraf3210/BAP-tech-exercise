<div>

  <div>
    <header>
      <h1>{{title}}</h1>
    </header>
  
    <table class="people-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Current Duty</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let person of persons()"
            (click)="openPersonDialog(person)"
            class="person-row">
          <td>{{ person.name }}</td>
          <td>{{ person.currentDutyTitle || '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
