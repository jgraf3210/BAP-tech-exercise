<div>
  <header class="d-flex justify-content-center">
    <h1>
      {{title}}
    </h1>
  </header>
      <table class="duty-table">
      <thead>
        <tr class="mx-1">
          <th>Name</th>
          <th>Start Date</th>
          <th>End Date</th>
        </tr>
      </thead>
      <tbody>
        <tr class="mx-1"
           *ngFor="let duty of duties()">
          <td>{{ duty.dutyTitle }}</td>
          <td>{{ duty.dutyStartDate | date }}</td>
          <td>{{ duty.dutyEndDate ? (duty.dutyEndDate | date) : '—' }}</td>
        </tr>
      </tbody>
    </table>

</div>
